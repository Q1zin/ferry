[package]
name = "ferry-app"
version.workspace = true
description = "ferry — разработка и тесты на нескольких устройствах"
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ferry_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
ferry-core = { path = "../../../crates/ferry-core" }
ferry-net = { path = "../../../crates/ferry-net" }
tracing = "0.1.44"
tokio = { version = "1", features = ["time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSColor", "NSBox", "NSTextField", "NSControl", "NSFont", "NSScreen", "NSGraphics", "NSText"] }
