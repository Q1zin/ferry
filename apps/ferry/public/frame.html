<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <!-- Рамка по краю экрана, пока устройством управляют (webview_frame в src-tauri/src/lib.rs; на маке — свои панели). -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        box-sizing: border-box;
        border: 4px solid #f25c3a;
        font: 600 12px/1 -apple-system, "Segoe UI", sans-serif;
      }
      #who {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 12px 7px;
        border-radius: 0 0 8px 8px;
        background: #f25c3a;
        color: #fff;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="who"></div>
    <script>
      document.getElementById("who").textContent = window.FERRY_WHO || "ferry";
    </script>
  </body>
