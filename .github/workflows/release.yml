# Релиз по тегу v<версия>: сборки для macOS и Windows, подписанные пакеты обновления и
# latest.json — в черновик релиза. Публикует черновик человек: только тогда устройства увидят
# новую версию. Запуск вручную (без тега) — только сборка, файлы — в артефактах прогона.
# Секреты: TAURI_SIGNING_PRIVATE_KEY — ключ подписи обновлений; MACOS_CERTIFICATE (base64 .p12)
# и MACOS_CERTIFICATE_PASSWORD — свой сертификат подписи кода для мака.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Подпись своим самоподписанным сертификатом, а не ad-hoc: требование к подписи у всех
      # сборок одно, и выданные macOS доступы (экран, «Универсальный доступ») переживают
      # обновления. Сертификат не от Apple — codesign примет его только доверенным, а Tauri с
      # APPLE_CERTIFICATE ищет только сертификаты Apple, поэтому ключник готовим сами.
      - name: ключник с сертификатом подписи
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/ferry.keychain-db"
          security create-keychain -p ferry "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p ferry "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ferry.p12"
          security import "$RUNNER_TEMP/ferry.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ferry "$keychain" >/dev/null
          # Остальные ключники — тоже в списке поиска: по одному на строку, слова в путях не делим.
          others=()
          while IFS= read -r line; do others+=("$(echo "$line" | tr -d '"' | sed 's/^ *//')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${others[@]}"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain apps/ferry/src-tauri/macos-signing.pem
          security find-identity -v -p codesigning "$keychain"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: apps/ferry
      - run: bun run release:mac
        working-directory: apps/ferry
        env:
          APPLE_SIGNING_IDENTITY: ferry
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            target/release/bundle/macos/ferry.app.tar.gz
            target/release/bundle/macos/ferry.app.tar.gz.sig
            target/release/bundle/macos/ferry.app/Contents/Info.plist
            target/release/bundle/dmg/*.dmg

  windows:
    # Как и локально: кросс-сборка mingw и установщик NSIS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # appindicator tauri CLI на Linux ищет даже для сборки под Windows: у приложения есть трей.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis libayatana-appindicator3-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: apps/ferry
      - run: bun run release:windows
        working-directory: apps/ferry
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: target/release/bundle
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: target/x86_64-pc-windows-gnu/release/bundle/nsis
      - name: тег совпадает с версией в Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "тег $GITHUB_REF_NAME, а в Cargo.toml $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: node apps/ferry/scripts/release.mjs
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "ferry $VERSION" --generate-notes "target/release-v$VERSION"/*
        env:
          GH_TOKEN: ${{ github.token }}
