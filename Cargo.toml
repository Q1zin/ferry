[workspace]
members = ["crates/ferry-core", "crates/ferry-net", "crates/ferry", "apps/ferry/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.90"

# Профиль задаётся на весь workspace (у члена он игнорируется).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
