[package]
name = "ferry-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ferry-core = { path = "../ferry-core" }
anyhow = "1.0.104"
getrandom = "0.3.4"
gethostname = "1.0"
hmac = "0.12.1"
if-addrs = "0.15"
iroh = "1.3.0"
irpc = { version = "0.17.0", features = ["derive"] }
irpc-iroh = "0.17.0"
mdns-sd = "0.21.5"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
spake2 = "0.4.0"
tar = "0.4"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
