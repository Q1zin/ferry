[package]
name = "ferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
ferry-core = { path = "../ferry-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ferry-net = { path = "../ferry-net" }
tokio = { version = "1.53", features = ["full"] }
